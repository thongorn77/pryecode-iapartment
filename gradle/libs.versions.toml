# libs.versions.toml — Version Catalog (ตารางเวอร์ชัน Library)
# ============================================================
# เก็บเวอร์ชัน library ทั้งหมดในที่เดียว ทำให้อัปเดตง่าย
# [versions]  = ตัวเลขเวอร์ชัน
# [libraries] = library พร้อม group/artifact/version
# [plugins]   = Gradle plugin

[versions]
agp                    = "8.5.2"
kotlin                 = "2.0.21"
ksp                    = "2.0.21-1.0.25"
coreKtx                = "1.13.1"
lifecycleRuntimeKtx    = "2.8.4"
activityCompose        = "1.9.2"
composeBom             = "2024.09.03"
navigationCompose      = "2.8.0"
room                   = "2.6.1"
hilt                   = "2.52"
hiltNavigationCompose  = "1.2.0"
hiltWork               = "1.2.0"
coroutines             = "1.8.1"
workManager            = "2.9.1"
playBilling            = "7.0.0"
credentialManager      = "1.2.2"
datastorePreferences   = "1.1.1"
coil                   = "2.6.0"
splashscreen           = "1.0.1"
zxingCore              = "3.5.3"
desugar                = "2.0.4"
junit                  = "4.13.2"
junitExt               = "1.2.1"
espresso               = "3.6.1"

[libraries]
androidx-core-ktx                 = { group = "androidx.core",          name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx    = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose",   version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose         = { group = "androidx.activity",      name = "activity-compose",            version.ref = "activityCompose" }
androidx-splashscreen             = { group = "androidx.core",          name = "core-splashscreen",           version.ref = "splashscreen" }
compose-bom                       = { group = "androidx.compose",       name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                        = { group = "androidx.compose.ui",    name = "ui" }
compose-ui-graphics               = { group = "androidx.compose.ui",    name = "ui-graphics" }
compose-ui-tooling-preview        = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
compose-material3                 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended   = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling                = { group = "androidx.compose.ui",    name = "ui-tooling" }
compose-ui-test-manifest          = { group = "androidx.compose.ui",    name = "ui-test-manifest" }
compose-ui-test-junit4            = { group = "androidx.compose.ui",    name = "ui-test-junit4" }
navigation-compose                = { group = "androidx.navigation",    name = "navigation-compose",          version.ref = "navigationCompose" }
room-runtime                      = { group = "androidx.room",          name = "room-runtime",                version.ref = "room" }
room-ktx                          = { group = "androidx.room",          name = "room-ktx",                    version.ref = "room" }
room-compiler                     = { group = "androidx.room",          name = "room-compiler",               version.ref = "room" }
hilt-android                      = { group = "com.google.dagger",      name = "hilt-android",                version.ref = "hilt" }
hilt-compiler                     = { group = "com.google.dagger",      name = "hilt-compiler",               version.ref = "hilt" }
hilt-navigation-compose           = { group = "androidx.hilt",          name = "hilt-navigation-compose",     version.ref = "hiltNavigationCompose" }
hilt-work                         = { group = "androidx.hilt",          name = "hilt-work",                   version.ref = "hiltWork" }
hilt-compiler-androidx            = { group = "androidx.hilt",          name = "hilt-compiler",               version.ref = "hiltWork" }
kotlinx-coroutines-android        = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
workmanager-ktx                   = { group = "androidx.work",          name = "work-runtime-ktx",            version.ref = "workManager" }
play-billing                      = { group = "com.android.billingclient", name = "billing-ktx",              version.ref = "playBilling" }
datastore-preferences             = { group = "androidx.datastore",     name = "datastore-preferences",       version.ref = "datastorePreferences" }
coil-compose                      = { group = "io.coil-kt",             name = "coil-compose",                version.ref = "coil" }
zxing-core                        = { group = "com.google.zxing",       name = "core",                        version.ref = "zxingCore" }
credentials                       = { group = "androidx.credentials",   name = "credentials",                 version.ref = "credentialManager" }
credentials-play-services-auth    = { group = "androidx.credentials",   name = "credentials-play-services-auth", version.ref = "credentialManager" }
google-id                         = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version = "1.1.1" }
desugar-jdk-libs                  = { group = "com.android.tools",      name = "desugar_jdk_libs",            version.ref = "desugar" }
junit                             = { group = "junit",                  name = "junit",                       version.ref = "junit" }
junit-ext                         = { group = "androidx.test.ext",      name = "junit",                       version.ref = "junitExt" }
espresso-core                     = { group = "androidx.test.espresso", name = "espresso-core",               version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application",          version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",   version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",          version.ref = "ksp" }
