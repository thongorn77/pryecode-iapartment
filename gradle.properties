# gradle.properties — ตั้งค่า Gradle และ Android build
# ============================================================
# android.useAndroidX = ใช้ AndroidX library (จำเป็นสำหรับทุกโปรเจกต์ใหม่)
# android.enableJetifier = แปลง legacy support library → AndroidX โดยอัตโนมัติ
# org.gradle.jvmargs = หน่วยความจำสำหรับ Kotlin compiler (ป้องกัน OutOfMemory)
# kotlin.code.style = รูปแบบ code style มาตรฐาน

android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
kotlin.code.style=official
